name: simple-server-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libmagic-dev pkg-config libbsd-dev valgrind
          # Criterion: package name is libcriterion-dev on recent Ubuntu.
          # CONFIRM it exists on ubuntu-latest; if not, build from source.
          sudo apt-get install -y libcriterion-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm libmagic pkg-config criterion

      - name: Build
        run: make STRICT_CFLAGS=-Werror=implicit-function-declaration
        # macOS: 'gmake' exists only if you 'brew install make'. Homebrew
        # 'make' = gmake. OR just call 'make' on macOS+Linux (GNU make is
        # the system make on both). Only FreeBSD needs the gmake distinction.

      - name: Test (Asan Included)
        run: make test-all-asan STRICT_CFLAGS=-Werror=implicit-function-declaration

      - name: Smoke test
        run: |
          echo "<html><body><h1>smoke test</h1></body></html>" > index.html

          nohup ./simple_server -v -p 8080 </dev/null > /tmp/server.log 2>&1 &
          disown
          SERVER_PID=$!
          sleep 1
          cat /tmp/server.log

          code=$(curl -s -o /tmp/response.html -w "%{http_code}" \
              --max-time 5 --connect-timeout 3 \
              http://127.0.0.1:8080/index.html)

          echo "--- response body ---"
          cat /tmp/response.html
          echo "--- server log ---"
          cat /tmp/server.log

          kill $SERVER_PID 2>/dev/null
          wait $SERVER_PID 2>/dev/null

          if [ "$code" = "200" ] && grep -q "smoke test" /tmp/response.html; then
              echo "smoke OK - served index.html successfully"
          else
              echo "smoke FAIL: got HTTP $code"
              exit 1
          fi

  build-test-freebsd:
    name: Build & Test (freebsd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cross-platform-actions/action@v0.27.0
        with:
          operating_system: freebsd
          version: "14.2" # the image that actually exists
          shell: bash
          run: |
            export IGNORE_OSVERSION=yes
            export ASSUME_ALWAYS_YES=yes
            sudo -E pkg update -f
            sudo -E pkg install -y gmake llvm pkgconf criterion valgrind
            gmake STRICT_CFLAGS=-Werror=implicit-function-declaration
            gmake test-all-asan CC=clang19 STRICT_CFLAGS=-Werror=implicit-function-declaration

            echo "<html><body><h1>smoke test</h1></body></html>" > index.html

            nohup ./simple_server -v -p 8080 </dev/null > /tmp/server.log 2>&1 &
            disown
            SERVER_PID=$!
            sleep 1
            cat /tmp/server.log

            code=$(curl -s -o /tmp/response.html -w "%{http_code}" \
                --max-time 5 --connect-timeout 3 \
                http://127.0.0.1:8080/index.html)

            echo "--- response body ---"
            cat /tmp/response.html
            echo "--- server log ---"
            cat /tmp/server.log

            kill $SERVER_PID 2>/dev/null
            wait $SERVER_PID 2>/dev/null

            if [ "$code" = "200" ] && grep -q "smoke test" /tmp/response.html; then
                echo "smoke OK - served index.html successfully"
            else
                echo "smoke FAIL: got HTTP $code"
                exit 1
            fi

  build-illumos:
    name: Build & Smoke (illumos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/omnios-vm@v1
        with:
          usesh: true
          mem: 6144
          timeout: 120
          prepare: |
            pkg install developer/gcc14 developer/build/gnu-make file
            # libmagic FMRI is uncertain on OmniOS — confirm real name:
            #   pkg search -r libmagic   (run on local OmniOS box)
            # then add it here, e.g. pkg install file/...
          run: |
            gmake CC=gcc STRICT_CFLAGS=-Werror=implicit-function-declaration
            echo "<html><body><h1>smoke test</h1></body></html>" > index.html

            nohup ./simple_server -v -p 8080 </dev/null > /tmp/server.log 2>&1 &
            SERVER_PID=$!
            sleep 1
            cat /tmp/server.log

            code=$(curl -s -o /tmp/response.html -w "%{http_code}" \
                --max-time 5 --connect-timeout 3 \
                http://127.0.0.1:8080/index.html)

            echo "--- response body ---"
            cat /tmp/response.html
            echo "--- server log ---"
            cat /tmp/server.log

            kill $SERVER_PID 2>/dev/null || true
            wait $SERVER_PID 2>/dev/null || true

            if [ "$code" = "200" ] && grep -q "smoke test" /tmp/response.html; then
                echo "smoke OK - served index.html successfully"
                exit 0
            else
                echo "smoke FAIL: got HTTP $code"
                exit 1
            fi

  docs:
    name: Documentation (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - run: gmake docs # requires docs/Doxyfile committed to repo
